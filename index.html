<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Shapes · 图形悬停效果</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage" aria-label="鼠标悬停图形展示">
    <!-- 外层保持固定，让鼠标感应区域不随图形上移。 -->
    <div class="tile" tabindex="0" aria-label="橙红色正方形">
      <div class="shape c1"><span>hover</span></div>
    </div>
    <div class="tile" tabindex="0" aria-label="绿色圆角方形">
      <div class="shape c2"><span>hover</span></div>
    </div>
    <div class="tile" tabindex="0" aria-label="紫色圆角方形">
      <div class="shape c3"><span>hover</span></div>
    </div>
    <div class="tile" tabindex="0" aria-label="橙黄色圆形">
      <div class="shape c4"><span>hover</span></div>
    </div>
    <div class="tile" tabindex="0" aria-label="青色圆角方形">
      <div class="shape c5"><span>hover</span></div>
    </div>
    <div class="tile" tabindex="0" aria-label="紫色圆形">
      <div class="shape c6"><span>hover</span></div>
    </div>
  </main>
</body>
</html>
